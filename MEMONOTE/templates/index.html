<form action="/create" method="post">
    <input type="text" name="title" placeholder="제목 입력"><br><br>

    <textarea name="message" placeholder="내용 입력"></textarea>
    <button>저장</button>
</form>

{% for memo in memos %}
    <div>
        <h3>{{ memo.title }}</h3>
        <p>{{ memo.message }}</p>
    </div>
{% endfor %}
