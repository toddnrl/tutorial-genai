<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단</title>
</head>
<body>
    <h1>구구단 출력기</h1>
    <input type="text" placeholder="단을 입력하세요 (예: 2)" id="input">
    <button onclick="printgugudan()">출력하기</button>
    <div id="result"></div>

    <script>
        function printgugudan() {

            const userinput = document.getElementById('input');
            const userinputValue = userinput.value;
            const userinputValueNumber = Number(userinputValue);

            const result = document.getElementById('result');

            // 🔴 예외 처리 먼저!
            if (userinputValue === '' || isNaN(userinputValueNumber)) {
                result.innerHTML = '<h3>다시 입력하세요</h3>';
                return; // 여기서 함수 종료
            }

            // ✅ 정상 실행
            result.innerHTML = `<h3>${userinputValueNumber}단</h3>`;

            for (let i = 1; i <= 9; i++) {
                result.innerHTML += `${userinputValueNumber} * ${i} = ${userinputValueNumber * i}<br>`;
            }
        }
    </script>
</body>
</html>
