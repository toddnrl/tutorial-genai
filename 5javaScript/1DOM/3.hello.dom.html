<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>나의 헤딩</h1>
    <p>첫번째 문장</p>
    <div id="output"><!---여기가 동적으로 컨텐츠를 채울 곳--></div>
    <p>두번째 문장</p>
    <button onclick="sayhello()">나의 버튼</button>
    <script>
        function sayhello(){
            console.log('sayhello');
            const myoutput = document.getElementById('output')
            myoutput.textContent = "나의 새로운 동적 운영"
        }
        
    </script>
</body>
</html>
