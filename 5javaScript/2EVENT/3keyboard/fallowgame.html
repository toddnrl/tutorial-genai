<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            background: blue;
            border-radius: 50%;
            pointer-events: none;
        }

        #enemy {
            position: absolute;
            width: 40px;
            height: 40px;
            background: red;
            border-radius: 50%;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 22px;
            font-weight: bold;
        }
        #restart{
            position: fixed;
            top: 50px;
        }
    </style>
</head>
<body>
    <div id="score">생존 시간 : 0초</div>
    <button id="restart">다시 플레이</button>
    <div id="player"></div>
    <div id="enemy"></div>

    <script>
        let player = document.getElementById("player");
        let enemy = document.getElementById("enemy");
        let scoreText = document.getElementById("score");


        
        let playerX = 200;
        let playerY = 200;

        let enemyX = 50;
        let enemyY = 50;

        let time = 0;
        let gameOver = false;

        document.addEventListener("mousemove", (e)=>{
            if(gameOver) return;

            playerX = e.clientX - 15;
            playerY = e.clientY - 15;

            player.style.left = playerX + "px";
            player.style.top = playerY + "px";

        });

        let enemyTimer = setInterval(()=>{
            if(gameOver) return;

            if(enemyX < playerX) enemyX += 3;
            if(enemyX > playerX) enemyX -= 3;
            if(enemyY < playerY) enemyY += 3;
            if(enemyY > playerY) enemyY -= 3;

            enemy.style.left = enemyX + "px";
            enemy.style.top = enemyY + "px";

            checkCollision();

        }, 20);

        let scoreTimer = setInterval(()=>{
            if(gameOver) return;

            time++;

            scoreText.innerText = "생존 시간 : " + time + "초";
        }, 1000);

        function checkCollision(){
            let dx = playerX - enemyX;
            let dy = playerY - enemyY;

            let distance = Math.sqrt(dx * dx + dy * dy);

            if(distance < 35 ){
                gameOver = true;
                clearInterval(enemyTimer);
                clearInterval(scoreTimer);
                alert("게임이 종료 생존 시간: " + time + "초");

            }
        }

        
    </script>
</body>
</html>
