<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #tl{
            width: 100px;
            height: 100px;
            background-color: #fbe7e7;
        }
        #time{
            width: 50px;
            height: 50px;
            background-color: #e5bfbf;
        }
    </style>
</head>
<body>
    <h1>타이머</h1>
    <div id="tl">남은 시간
        <div id="time">10</div>
        <button onclick="s()">시작</button>
        <button onclick="e()">중지</button>
    </div>

    <script>
        let time = 10;
        let timer;
        function s(){
            clearInterval(timer)
            timer = setInterval(()=>{
                time--;
                document.getElementById("time").innerText = time;

                if(time <= 0){
                    clearInterval(timer);
                    alert("끝");
                }
            },1000);
        }
        function e(){
            clearInterval(timer);
        }
    </script>
</body>
</html>
