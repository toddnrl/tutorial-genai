<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>외부 요청 테스트</h1>
    <button id="loadBtn">데이터 요청</button>
    <div id="result"></div>
    <script>
        document.getElementById("loadBtn").addEventListener('click',()=>{
            console.log('버튼 클릭됨');
            fetch('https://jsonplaceholder.typicode.com/todos/1').then((response) =>{
                if (!response.ok){
                    console.log('응답은 왔으나 ok가 아님: ', response);
                    throw new Error("알수없는 오류가 발생")
                    
                }
                console.log('성공적인 응답이 왔음 응답은 : ', response);
                return response.json(); //온 응답이 JSON이니까 그걸로 자료구조
            }).then((data) =>{
                console.log("최종 파싱이 끝난 JSON 자료구조가 넘어옴 :", data)
                //이 받아온 데이터로 내 DOM에 랜더링
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                    <ul><li>Id: ${data.id}</li> <li>Title: ${data.title}</li></ul>
                `;


            }).catch((error) => {
                console.log("위에 fetch를 처리하고 가공하는 과정중 오류가 남");
            })
        })
    </script>
</body>
</html>
