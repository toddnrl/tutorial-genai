<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>외부 요청 테스트</h1>
    <input type="number" id="uid">
    <button id="loadBtn">데이터 요청</button>
    <button id="saveBtn">데이터 쓰기</button>
    <button id="delBtn">데이터 삭제</button>
    <button id="modBtn">데이터 수정</button>



    <div id="result"></div>
    <script>

        /* PUT */
        document.getElementById('modBtn').addEventListener('click', () =>{
            const userid = document.getElementById('uid').value;

            const putData = {
                title: 'hello',
                body: 'world',
                userId: userid,
                id: userid
            };
            fetch(`https://jsonplaceholder.typicode.com/posts/${userid}`,{
                method: 'PUT',
                headers: {
                    'Content-type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify(putData)
            })
                .then(resp => resp.json())
                .then(data => console.log(data))
        })






        /* delete 정보 요청 */
        document.getElementById('delBtn').addEventListener('click', () =>{
            const userid = document.getElementById('uid').value;
            fetch(`https://jsonplaceholder.typicode.com/posts/${userid}`,{
                method: 'DELETE'
            });
        })




        /*post 정보 요청*/
        document.getElementById('saveBtn').addEventListener('click', () => {
            const postData = {
                title: 'hello',
                body: 'world',
                userId: 1
            };
            fetch(`https://jsonplaceholder.typicode.com/posts`,{
                method: 'post',
                headers: {
                    'Content-type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify(postData)
            })
            .then(resp => resp.json())
            .then(data => console.log(data))
        })
        
        //get 정보 요청
        document.getElementById("loadBtn").addEventListener('click',()=>{
            const userid = document.getElementById('uid').value;
            fetch(`https://jsonplaceholder.typicode.com/users/${userid}`)
            .then((response) => response.json())
            .then((data) =>{
                
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                <ul>
                    <li>사용자 ID: ${data.id}</li>
                    <li>사용자 이름: ${data.username}</li>
                    <li>사용자 도시: ${data.city}</li>
                </ul>
                `;
            }).catch((error) => {
                console.log("위에 fetch를 처리하고 가공하는 과정중 오류가 남");
            })
        })
    </script>
</body>
</html>
