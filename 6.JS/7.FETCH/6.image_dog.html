<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width:200px;
            border-radius:10px;
            margin-top:20px;
        }
    </style>
</head>
<body>
    <!-- 버튼을 클릭하면 이미지를 화면에 출력한다 -->
    <!-- 요청해야할 주소는 dog.com에 방문해서 random 강아지 사진 출력 -->
    

    <button id="loadBtn">데이터 요청</button>
    <div id="result"></div>

    <script>
        document.getElementById("loadBtn").addEventListener('click',()=>{
            fetch(`https://dog.ceo/api/breeds/image/random`)
            .then((response) => response.json())
            .then((data) =>{
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                        <h3>랜덤 강아지</h3>

                        <img src="${data.message}" alt="강아지 사진">
                    `;
                })
                .catch(error => {console.error("알수없는 요청", error);


                })
        })
        
    </script>
    


</body>
</html>
